# Build multiversion (versions/<mc>-fabric). Valores de https://fabricmc.net/develop
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Lo comun a todas las versiones; lo de cada una esta en build.gradle.kts (Target)
essential.defaults.loom=0
essential.defaults.loom.fabric-loader=net.fabricmc:fabric-loader:0.19.5
essential.defaults.loom.mappings=mojmap
loom.ignoreDependencyLoomVersionValidation=true

# ViaVersion/ViaBackwards: tiene que soportar la version mas nueva de servidor
via_version=5.12.2

mod_version=0.4.1
maven_group=es.furynocturn
archives_base_name=fnviaviewer
